name: Generate Snake Animation

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pratama1246
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1169ba&color_dots=#ebedf0,#c8dff3,#87b9e2,#428dcc,#1169ba
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#6db7f2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
